name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rentnest
          POSTGRES_PASSWORD: rentnest
          POSTGRES_DB: rentnest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rentnest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://rentnest:rentnest@localhost:5432/rentnest?schema=public
      AUTH_SECRET: ci-only-secret-not-used-in-production-123
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SEED_ADMIN_EMAIL: admin@rentnestlahore.pk
      SEED_ADMIN_PASSWORD: CiAdminPassword123
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed:demo
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start server
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 1; done
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_ADMIN_EMAIL: admin@rentnestlahore.pk
          E2E_ADMIN_PASSWORD: CiAdminPassword123
      - if: failure()
        run: cat server.log || true
